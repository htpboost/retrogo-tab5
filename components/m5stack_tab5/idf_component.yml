# Tab5 BSP の依存。retro-go(非LVGL)に取り込むため、m5stack_tab5.c が実際に
# #include しているコンポーネントへ整合させた。
# - 表示3種を自動検出: esp_lcd_ili9881c(managed) + ローカル esp_lcd_st7121 / esp_lcd_st7123
# - タッチ: gt911(ILI9881C機) / st7123(統合機)
# - 音声: esp_codec_dev(ES8388/ES7210)
# - 入力(Phase2): usb_host_hid
# - LVGL: bsp_display_start系で使用。我々は bsp_display_new_with_handles(非LVGL)を使うが、
dependencies:
  espressif/esp_lcd_ili9881c: "^1.0.0"
  espressif/esp_lcd_touch_gt911: "^1.1.1~2"
  espressif/esp_lcd_touch_st7123: "^1.0.0"
  espressif/esp_codec_dev: "^1.3.0"
  espressif/usb_host_hid: "^1.0.3"
